    <script type="text/javascript">
      document.addEventListener("DOMContentLoaded", function () {
        let passwordField = document.getElementById("txtPassword");
        if (passwordField) {
          passwordField.addEventListener("copy", preventCopyPaste);
          passwordField.addEventListener("paste", preventCopyPaste);
          passwordField.addEventListener("cut", preventCopyPaste);
        }
      });
      function preventCopyPaste(event) {
        event.preventDefault();
        alert("Copy-paste is disabled for security reasons.");
      }
    </script>
    <script type="text/javascript">
      window.history.forward();
      function noBack() {
        window.history.forward();
      }
      function burstCache() {
        if (!navigator.onLine) {
          window.location = "../Home/Index";
        }
      }
      history.go(1);
    </script>
    <script type="text/javascript">
      $(document).ready(function () {
        function captcha() {
          // console.log("Captcha refresh function triggered.");
          $.ajax({
            url: "/ResultoService26/JE26S1P1/ShowCaptchaImage",
            cache: false,
            success: function (html) {
              //console.log("Captcha image loaded successfully.");
              var img = document.getElementById("capimage");
              img.src = ""; // Clear the current image
              img.src = "../JE26S1P1/ShowCaptchaImage?" + new Date().getTime(); // Force refresh
              $("#Captcha1").val("");
            },
            error: function (response) {
              // alert('Failed to load captcha');
            },
          });
        }

        $("#captcha-refresh-btn").on("click", function () {
          captcha();
        });
      });
    </script>

    <script type="text/javascript">
      function AdminLogin_ValidatorFun(salt) {
        if (document.getElementById("txtPassword").value != "") {
          document.getElementById("txtPassword").value = SHA256(
            document.getElementById("txtPassword").value,
          ).toUpperCase();
          document.getElementById("txtPassword").value = SHA256(
            document.getElementById("txtPassword").value + salt,
          ).toUpperCase();

          var len = document.getElementById("txtPassword").value.length;
          if (len > 64 || len < 64) {
            alert(
              "Operation can not be performed.Your browser is not supporting Password Encryption.",
            );
            return false;
          }
          return true;
        }
      }
    </script>
